<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>UCES — University Course Evaluation System</title>
<style>
/* ─── Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6;color:#1f2328;background:#f1f5f9;min-height:100vh}

/* ─── Utilities ─── */
.hidden{display:none!important}
.flex{display:flex}
.flex-col{flex-direction:column}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-2{gap:8px}
.gap-3{gap:12px}
.gap-4{gap:16px}
.w-full{width:100%}
.mt-1{margin-top:4px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.mb-4{margin-bottom:16px}
.mb-6{margin-bottom:24px}
.text-sm{font-size:12px}
.text-muted{color:#57606a}
.bold{font-weight:700}
.semibold{font-weight:600}

/* ─── Login ─── */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);
}
.login-box{
  background:#fff;border-radius:16px;padding:40px 44px;width:420px;
  box-shadow:0 25px 80px rgba(0,0,0,.4);
}
.login-brand{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.5px}
.login-brand span{color:#3b82f6}
.login-tagline{font-size:13px;color:#64748b;margin-bottom:32px;margin-top:2px}
.form-row{margin-bottom:18px}
.form-label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-input{
  width:100%;padding:10px 13px;border:1.5px solid #e2e8f0;border-radius:8px;
  font-size:14px;color:#1f2328;background:#fafafa;transition:all .15s;
}
.form-input:focus{outline:none;border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px #bfdbfe44}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.role-tab{
  padding:10px;border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;
  text-align:center;font-size:13px;font-weight:600;color:#64748b;transition:all .15s;
}
.role-tab.active{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8}
.btn-login{
  width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;
  border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;
}
.btn-login:hover{background:#2563eb}
.login-demo{font-size:11px;color:#94a3b8;text-align:center;margin-top:14px}
.login-demo strong{color:#64748b}

/* ─── App Shell ─── */
#appShell{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}

/* ─── Sidebar ─── */
.sidebar{
  width:235px;background:#0f172a;flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar-brand{
  padding:22px 20px 18px;border-bottom:1px solid #1e293b;
  font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;
}
.sidebar-brand span{color:#60a5fa}
.sidebar-semester{font-size:11px;color:#475569;font-weight:500;margin-top:2px}
.sidebar-nav{flex:1;padding:10px 0}
.nav-section-label{
  font-size:10px;font-weight:700;color:#334155;text-transform:uppercase;
  letter-spacing:.08em;padding:14px 20px 4px;
}
.nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;
  font-size:13px;color:#94a3b8;border-left:3px solid transparent;transition:all .15s;
}
.nav-link:hover{background:#1e293b;color:#e2e8f0}
.nav-link.active{background:#1e3a5f;color:#93c5fd;border-left-color:#3b82f6;font-weight:600}
.nav-link .nav-icon{font-size:15px;width:18px;text-align:center}
.nav-badge{
  margin-left:auto;background:#3b82f6;color:#fff;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;
}
.sidebar-user{
  padding:14px 20px;border-top:1px solid #1e293b;
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:34px;height:34px;border-radius:50%;background:#1e40af;
  color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.avatar.admin-av{background:#7c3aed}
.user-info{flex:1;overflow:hidden}
.user-name{font-size:13px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#475569}
.logout-btn{
  background:none;border:none;color:#475569;cursor:pointer;font-size:14px;
  transition:color .15s;padding:2px;
}
.logout-btn:hover{color:#f87171}

/* ─── Main Content ─── */
.main-area{flex:1;display:flex;flex-direction:column;overflow-x:hidden}
.topbar{
  background:#fff;border-bottom:1px solid #e2e8f0;padding:0 28px;
  height:58px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;position:sticky;top:0;z-index:10;
}
.topbar-title{font-size:17px;font-weight:700;color:#0f172a}
.topbar-right{display:flex;align-items:center;gap:12px}
.chip{
  font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;
}
.chip-blue{background:#dbeafe;color:#1d4ed8}
.chip-purple{background:#ede9fe;color:#6d28d9}
.chip-green{background:#dcfce7;color:#15803d}
.chip-amber{background:#fef3c7;color:#92400e}
.chip-slate{background:#f1f5f9;color:#475569}
.page-content{flex:1;padding:28px;overflow-y:auto}

/* ─── Stat Cards ─── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.stat-card{
  background:#fff;border:1px solid #e2e8f0;border-radius:12px;
  padding:20px 22px;position:relative;overflow:hidden;
}
.stat-card::after{
  content:'';position:absolute;top:0;right:0;width:4px;height:100%;
  background:var(--accent,#3b82f6);
}
.stat-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:30px;font-weight:800;color:#0f172a;margin-top:6px;line-height:1}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:4px}
.stat-trend{font-size:11px;font-weight:700;margin-top:6px}
.trend-up{color:#16a34a}
.trend-down{color:#dc2626}

/* ─── Section Headers ─── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.section-title{font-size:15px;font-weight:700;color:#0f172a}
.section-sub{font-size:12px;color:#94a3b8;margin-top:1px}

/* ─── Course Cards ─── */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.course-card{
  background:#fff;border:1px solid #e2e8f0;border-radius:12px;
  padding:20px 22px;display:flex;flex-direction:column;gap:12px;
  transition:box-shadow .15s,transform .15s;
}
.course-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
.course-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.course-code-badge{
  font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;
  background:#eff6ff;color:#1d4ed8;letter-spacing:.03em;
}
.status-pill{
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0;
}
.status-open{background:#dcfce7;color:#15803d}
.status-closed{background:#f1f5f9;color:#64748b}
.status-done{background:#fef9c3;color:#854d0e}
.course-title{font-size:15px;font-weight:700;color:#0f172a;line-height:1.3}
.course-instructor{font-size:12px;color:#64748b;display:flex;align-items:center;gap:5px}
.course-meta-row{display:flex;flex-wrap:wrap;gap:8px}
.meta-tag{
  font-size:11px;color:#94a3b8;background:#f8fafc;
  border:1px solid #e2e8f0;border-radius:4px;padding:2px 7px;
}
.course-rating-preview{
  background:#f8fafc;border-radius:8px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.rating-stars{color:#f59e0b;font-size:15px;letter-spacing:1px}
.rating-num{font-size:13px;font-weight:700;color:#0f172a}
.course-actions{display:flex;gap:8px;margin-top:4px}
.btn-eval{
  flex:1;padding:9px 0;background:#3b82f6;color:#fff;border:none;
  border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s;
}
.btn-eval:hover{background:#2563eb}
.btn-eval:disabled{background:#93c5fd;cursor:not-allowed;opacity:.7}
.btn-view{
  padding:9px 14px;background:transparent;color:#64748b;
  border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;
  cursor:pointer;transition:all .15s;
}
.btn-view:hover{border-color:#94a3b8;color:#374151}

/* ─── Eval Form ─── */
.eval-wrap{max-width:650px}
.eval-hero{
  background:linear-gradient(135deg,#1e3a5f,#1e40af);
  border-radius:12px;padding:24px 26px;margin-bottom:24px;color:#fff;
}
.eval-hero-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#93c5fd;margin-bottom:4px}
.eval-hero-title{font-size:20px;font-weight:800;margin-bottom:4px}
.eval-hero-meta{font-size:13px;color:#bfdbfe}
.anon-notice{
  background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;
  padding:10px 14px;font-size:13px;color:#15803d;margin-bottom:22px;
  display:flex;align-items:center;gap:8px;
}
.eval-card{
  background:#fff;border:1px solid #e2e8f0;border-radius:12px;
  padding:26px 28px;margin-bottom:16px;
}
.eval-q-num{font-size:11px;font-weight:700;color:#3b82f6;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.eval-q-title{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:2px}
.eval-q-hint{font-size:12px;color:#94a3b8;margin-bottom:14px}
/* Stars */
.star-row{display:flex;align-items:center;gap:4px}
.s{font-size:32px;cursor:pointer;color:#e2e8f0;transition:color .1s,transform .1s;line-height:1;user-select:none}
.s.on{color:#f59e0b}
.s.hover-on{color:#fbbf24;transform:scale(1.2)}
.star-desc{font-size:13px;color:#64748b;margin-left:10px;min-width:80px}
/* Comments */
.form-textarea{
  width:100%;padding:11px 13px;border:1.5px solid #e2e8f0;border-radius:8px;
  font-size:13px;color:#1f2328;font-family:inherit;resize:vertical;min-height:100px;
  transition:border-color .15s;
}
.form-textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px #bfdbfe44}
.eval-actions{display:flex;align-items:center;gap:10px;margin-top:6px}
.btn-submit{
  padding:11px 32px;background:#0f172a;color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;
}
.btn-submit:hover{background:#1e293b}
.btn-cancel{
  padding:11px 20px;background:transparent;color:#64748b;
  border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;cursor:pointer;transition:all .15s;
}
.btn-cancel:hover{border-color:#94a3b8;color:#374151}
.eval-error{font-size:13px;color:#dc2626;margin-top:4px;display:none}

/* ─── Success ─── */
.success-card{
  max-width:560px;background:#fff;border:1.5px solid #86efac;
  border-radius:16px;padding:36px 40px;text-align:center;
}
.success-icon-wrap{
  width:72px;height:72px;background:#dcfce7;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:34px;
}
.success-title{font-size:22px;font-weight:800;color:#15803d;margin-bottom:8px}
.success-body{font-size:14px;color:#166534;margin-bottom:20px;line-height:1.7}
.success-score-row{
  display:flex;justify-content:center;gap:24px;
  background:#f0fdf4;border-radius:10px;padding:16px;margin-bottom:24px;
}
.score-item{text-align:center}
.score-item .score-val{font-size:22px;font-weight:800;color:#15803d}
.score-item .score-lbl{font-size:11px;color:#4ade80;font-weight:600;text-transform:uppercase}
.btn-back{
  padding:11px 28px;background:#15803d;color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;
}
.btn-back:hover{background:#166534}

/* ─── Admin Dashboard ─── */
.dim-bars{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px 24px;margin-bottom:24px}
.dim-row{margin-bottom:16px}
.dim-row:last-child{margin-bottom:0}
.dim-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
.bar-wrap{background:#f1f5f9;border-radius:6px;height:10px}
.bar-fill{height:10px;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ─── Table ─── */
.tbl-wrap{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:#374151;font-weight:700;text-align:left;padding:11px 16px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}

/* ─── Comments Feed ─── */
.comments-feed{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px}
.comment-item{border-bottom:1px solid #f1f5f9;padding-bottom:14px;margin-bottom:14px}
.comment-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.comment-course{font-size:11px;font-weight:700;color:#3b82f6;text-transform:uppercase;letter-spacing:.04em}
.comment-text{font-size:13px;color:#374151;margin-top:3px;font-style:italic}
.comment-meta{font-size:11px;color:#94a3b8;margin-top:4px}

/* ─── Progress Ring ─── */
.ring-wrap{position:relative;width:90px;height:90px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-val{font-size:18px;font-weight:800;color:#0f172a;line-height:1}
.ring-lbl{font-size:10px;color:#94a3b8;font-weight:600}

/* ─── Responsive ─── */
@media(max-width:640px){
  .sidebar{display:none}
  .page-content{padding:16px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .course-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-brand"><span>UC</span>ES</div>
    <div class="login-tagline">University Course Evaluation System</div>
    <div class="role-tabs">
      <div class="role-tab active" onclick="selectRole('student',this)" id="tab-student">🎓 Student</div>
      <div class="role-tab" onclick="selectRole('admin',this)" id="tab-admin">🛡 Administrator</div>
    </div>
    <div class="form-row">
      <label class="form-label">Email</label>
      <input class="form-input" id="emailInput" type="email" value="ahmad@university.edu"/>
    </div>
    <div class="form-row">
      <label class="form-label">Password</label>
      <input class="form-input" id="passInput" type="password" value="••••••••"/>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-demo">Demo — select <strong>Student</strong> or <strong>Admin</strong> and click Sign In</div>
  </div>
</div>

<!-- ═══════════ APP SHELL ═══════════ -->
<div id="appShell">
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div><span>UC</span>ES <span style="font-weight:400;color:#475569">Portal</span></div>
        <div class="sidebar-semester">Fall Semester 2024–2025</div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-user">
        <div class="avatar" id="sidebarAvatar">A</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">—</div>
          <div class="user-role" id="sidebarRole">—</div>
        </div>
        <button class="logout-btn" title="Log out" onclick="doLogout()">⏻</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-right">
          <span class="chip" id="topbarChip">Student</span>
          <span style="font-size:13px;color:#94a3b8;font-weight:500" id="topbarDate"></span>
        </div>
      </header>
      <main class="page-content" id="pageContent"></main>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   DATA
════════════════════════════════════════════ */
const USERS = {
  student: { name:'Ahmad Al-Zahrawi', role:'student', id:'S001', dept:'Computer Science', year:'3rd Year' },
  admin:   { name:'Dr. Nadia Al-Farsi', role:'admin',  id:'A001', dept:'Academic Affairs', title:'Academic Affairs Director' }
};

const COURSES = [
  { id:1,  code:'CS301',  title:'Software Engineering',          instructor:'Dr. Khalid Nasser',     dept:'Computer Science', credits:3, category:'Core', windowOpen:true  },
  { id:2,  code:'CS240',  title:'Data Structures & Algorithms',  instructor:'Dr. Sara Al-Mansouri',  dept:'Computer Science', credits:3, category:'Core', windowOpen:true  },
  { id:3,  code:'DB250',  title:'Database Management Systems',   instructor:'Dr. Layla Hamdan',      dept:'Computer Science', credits:3, category:'Core', windowOpen:true  },
  { id:4,  code:'NET180', title:'Computer Networks',             instructor:'Dr. Omar Bishara',      dept:'Networks',         credits:2, category:'Elective', windowOpen:true  },
  { id:5,  code:'AI350',  title:'Introduction to AI & ML',       instructor:'Dr. Fatima Al-Sayed',   dept:'Computer Science', credits:3, category:'Elective', windowOpen:true  },
  { id:6,  code:'MATH201',title:'Discrete Mathematics',          instructor:'Dr. Reem Qasim',        dept:'Mathematics',      credits:3, category:'Foundation', windowOpen:false },
];

// Pre-seeded evaluations so admin has real data on first load
const SEEDED = [
  { courseId:1, instructorR:5, contentR:4, assignmentsR:4, resourcesR:5, overallR:5,
    comments:'Dr. Nasser is exceptional. Clear explanations and always available for questions.',
    submittedAt:'Dec 10, 2024 09:14' },
  { courseId:2, instructorR:4, contentR:5, assignmentsR:3, resourcesR:4, overallR:4,
    comments:'Great depth of content. Assignments were occasionally unclear.',
    submittedAt:'Dec 11, 2024 11:32' },
  { courseId:3, instructorR:3, contentR:4, assignmentsR:4, resourcesR:3, overallR:3,
    comments:'Database fundamentals well taught. Labs could use more real-world examples.',
    submittedAt:'Dec 12, 2024 14:05' },
  { courseId:4, instructorR:4, contentR:4, assignmentsR:5, resourcesR:4, overallR:4,
    comments:'Very well organised course. Practical labs were the highlight.',
    submittedAt:'Dec 13, 2024 10:20' },
  { courseId:5, instructorR:5, contentR:5, assignmentsR:4, resourcesR:5, overallR:5,
    comments:'Best course this semester. Dr. Al-Sayed makes AI fascinating!',
    submittedAt:'Dec 13, 2024 15:48' },
];

const state = {
  user: null,
  page: 'login',
  evaluations: [...SEEDED],   // starts with seeded data
  submittedByCurrent: new Set(), // tracks what THIS session's student submitted
  evalTarget: null,
  tempR: {instructor:0,content:0,assignments:0,resources:0,overall:0},
  hoverR:{instructor:0,content:0,assignments:0,resources:0,overall:0},
};

/* ════════════════════════════════════════════
   AUTH
════════════════════════════════════════════ */
let selectedRole = 'student';
function selectRole(r, el){
  selectedRole = r;
  document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('emailInput').value = r==='admin' ? 'nadia@university.edu' : 'ahmad@university.edu';
}
function doLogin(){
  state.user = USERS[selectedRole];
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='block';
  setupShell();
  navigate(state.user.role==='admin' ? 'admin-dashboard' : 'student-dashboard');
}
function doLogout(){
  state.user=null; state.submittedByCurrent=new Set();
  state.tempR={instructor:0,content:0,assignments:0,resources:0,overall:0};
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  selectedRole='student';
  document.getElementById('tab-student').classList.add('active');
  document.getElementById('tab-admin').classList.remove('active');
  document.getElementById('emailInput').value='ahmad@university.edu';
}

/* ════════════════════════════════════════════
   SHELL SETUP
════════════════════════════════════════════ */
function setupShell(){
  const u = state.user;
  const av = document.getElementById('sidebarAvatar');
  av.textContent = u.name[0];

const PAGE_TITLES={
  'student-dashboard':'Dashboard','student-courses':'My Courses',
  'student-history':'My Evaluations','evaluate':'Course Evaluation',
  'eval-success':'Evaluation Submitted',
  'admin-dashboard':'Analytics Dashboard','admin-courses':'Course Results',

function navigate(page, data){
  state.page=page;

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
function isSubmitted(cid){ return state.submittedByCurrent.has(cid); }
function getEval(cid){ return state.evaluations.find(e=>e.courseId===cid); }
function courseAvg(ev){ return ev?((ev.instructorR+ev.contentR+ev.assignmentsR+ev.resourcesR+ev.overallR)/5).toFixed(1):null; }
function stars(n,max=5){ return '★'.repeat(n)+'☆'.repeat(max-n); }
function starsColored(n){ return `<span style="color:#f59e0b">${'★'.repeat(n)}</span><span style="color:#e2e8f0">${'☆'.repeat(5-n)}</span>`; }
function scoreChip(v){
  if(!v) return '<span style="color:#94a3b8">—</span>';
  const f=parseFloat(v);
  const cls = f>=4.5?'chip-green':f>=3.5?'chip-blue':f>=2.5?'chip-amber':'chip-amber';
  return `<span class="chip ${cls}">${v}</span>`;
}
function globalAvg(){
  if(!state.evaluations.length) return null;
  const s=state.evaluations.reduce((a,e)=>{
    return a+(e.instructorR+e.contentR+e.assignmentsR+e.resourcesR+e.overallR)/5;
  },0);
  return (s/state.evaluations.length).toFixed(2);
}
function dimAvg(key){
  if(!state.evaluations.length) return 0;
  return (state.evaluations.reduce((a,e)=>a+e[key],0)/state.evaluations.length).toFixed(2);
}
function participationRate(){
  const eligible = COURSES.filter(c=>c.windowOpen).length;
  if(!eligible) return 0;
  // count distinct courseIds in evaluations for open courses
  const evCourses = new Set(state.evaluations.filter(e=>{
    return COURSES.find(c=>c.id===e.courseId&&c.windowOpen);
  }).map(e=>e.courseId));
  return Math.round((evCourses.size/eligible)*100);
}
function starLabel(n){ return ['','Poor','Fair','Good','Very Good','Excellent'][n]||''; }

/* ─── Star Binding ─── */
function bindStars(){
  state.tempR={instructor:0,content:0,assignments:0,resources:0,overall:0};
  state.hoverR={instructor:0,content:0,assignments:0,resources:0,overall:0};
  document.querySelectorAll('.s').forEach(s=>{
    const k=s.dataset.k, v=parseInt(s.dataset.v);
    s.addEventListener('mouseenter',()=>{ state.hoverR[k]=v; refreshRow(k); });
    s.addEventListener('mouseleave',()=>{ state.hoverR[k]=0; refreshRow(k); });
    s.addEventListener('click',()=>{ state.tempR[k]=v; state.hoverR[k]=0; refreshRow(k); });
  });
}
function refreshRow(k){
  const cur=state.tempR[k], hov=state.hoverR[k], disp=hov||cur;
  document.querySelectorAll(`.s[data-k="${k}"]`).forEach(s=>{
    const v=parseInt(s.dataset.v);
    s.className='s'+(v<=disp?' on':'')+(hov>0&&v<=hov&&v>cur?' hover-on':'');
  });
  const desc=document.getElementById(`desc-${k}`);
  if(desc) desc.textContent=disp?starLabel(disp):'Click to rate';
}
function startEval(cid){
  state.evalTarget=COURSES.find(c=>c.id===cid);
  state.tempR={instructor:0,content:0,assignments:0,resources:0,overall:0};
  state.hoverR={instructor:0,content:0,assignments:0,resources:0,overall:0};
  navigate('evaluate');
}
function submitEval(){
  const r=state.tempR;
  if(!r.instructor||!r.content||!r.assignments||!r.resources||!r.overall){
    const e=document.getElementById('evalError'); e.style.display='block';
    e.scrollIntoView({behavior:'smooth',block:'center'}); return;
  }
  const c=state.evalTarget;
  const now=new Date();
  const ts=now.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+
            now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const comments=(document.getElementById('evalComments').value||'').trim();

  // Remove any pre-seeded entry for this course, then add new one
  state.evaluations = state.evaluations.filter(e=>e.courseId!==c.id);
  state.evaluations.push({
    courseId:c.id,
    instructorR:r.instructor, contentR:r.content, assignmentsR:r.assignments,
    resourcesR:r.resources, overallR:r.overall,
    comments:comments||null, submittedAt:ts,
  });
  state.submittedByCurrent.add(c.id);
  updatePendingBadge();
  navigate('eval-success');
}

        </div>
      </div>
      <div style="font-size:18px;color:#f59e0b">${stars(Math.round(parseFloat(avg||0)))}</div>
      <div style="font-size:11px;color:#94a3b8;text-align:center">${total} evaluation${total!==1?'s':''} received</div>
    </div>
  </div>

  <div class="section-header"><div class="section-title">Course Evaluation Summary</div></div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Course</th><th>Instructor</th><th>Responses</th><th>Instructor ★</th><th>Content ★</th><th>Overall ★</th><th>Avg Score</th></tr></thead>
    <tbody>
    ${COURSES.map(c=>{
      const ev=getEval(c.id);
      const avg=ev?courseAvg(ev):null;
      return `<tr>
        <td><strong>${c.code}</strong><br/><span class="text-sm text-muted">${c.title}</span></td>
        <td class="text-sm">${c.instructor}</td>
        <td>${ev?`<span class="chip chip-blue">1</span>`:'<span class="text-muted text-sm">—</span>'}</td>
        <td>${ev?starsColored(ev.instructorR):'—'}</td>
        <td>${ev?starsColored(ev.contentR):'—'}</td>
        <td>${ev?starsColored(ev.overallR):'—'}</td>
        <td>${scoreChip(avg)}</td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}

function renderAdminCourses(){
  return `

      {label:'Content',   val:ev?ev.contentR:0,   color:'#8b5cf6'},
      {label:'Assignments',val:ev?ev.assignmentsR:0,color:'#f59e0b'},
      {label:'Resources', val:ev?ev.resourcesR:0, color:'#06b6d4'},
      {label:'Overall',   val:ev?ev.overallR:0,   color:'#22c55e'},

    return `
    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 24px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <div>
          <span class="course-code-badge">${c.code}</span>
          <div style="font-size:16px;font-weight:700;color:#0f172a;margin-top:6px">${c.title}</div>
          <div style="font-size:12px;color:#64748b;margin-top:2px">👤 ${c.instructor} · ${c.dept}</div>
        </div>
        <div style="text-align:right">
          ${avg?`<div style="font-size:24px;font-weight:800;color:#0f172a">${avg}/5</div>
          <div style="font-size:16px;color:#f59e0b">${stars(Math.round(parseFloat(avg)))}</div>`:
          `<span class="chip chip-slate">No data yet</span>`}
        </div>
      </div>
      ${ev?`
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
        ${dims.map(d=>`
        <div style="text-align:center;background:#f8fafc;border-radius:8px;padding:10px 6px">
          <div style="font-size:20px;font-weight:800;color:${d.color}">${d.val}</div>
          <div style="font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px">${d.label}</div>
          <div style="font-size:12px;color:#f59e0b;margin-top:3px">${stars(d.val)}</div>
        </div>`).join('')}
      </div>
      ${ev.comments?`<div style="margin-top:14px;background:#f0fdf4;border-left:3px solid #86efac;border-radius:0 6px 6px 0;padding:10px 14px;font-size:13px;color:#166534;font-style:italic">"${ev.comments}"</div>`:''}
      `:`<div style="font-size:13px;color:#94a3b8;text-align:center;padding:20px 0">No evaluations received for this course yet.</div>`}
    </div>`;
  }).join('')}`;
}

/* ════════════════════════════════════════════
   ADMIN COMMENTS
════════════════════════════════════════════ */
function renderAdminComments(){
  const withComments = state.evaluations.filter(e=>e.comments).reverse();
  if(!withComments.length) return `
  <div style="text-align:center;padding:60px 0;color:#94a3b8">
    <div style="font-size:48px;margin-bottom:12px">💬</div>
    <div style="font-size:16px;font-weight:700;color:#475569">No comments yet</div>
  </div>`;

  return `
  <div class="section-header"><div><div class="section-title">Recent Student Feedback (${withComments.length})</div>
  <div class="section-sub">All comments are fully anonymised</div></div></div>
  <div class="comments-feed">
    ${withComments.map(ev=>{
      const c=COURSES.find(x=>x.id===ev.courseId);
      const avg=courseAvg(ev);
      return `
      <div class="comment-item">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span class="comment-course">${c.code} — ${c.title}</span>
          <span class="chip chip-blue">${avg} avg</span>
        </div>
        <div class="comment-text">"${ev.comments}"</div>
        <div class="comment-meta">👤 Anonymous · ${ev.submittedAt} · ${c.instructor}</div>
      </div>`;
    }).join('')}
  </div>`;
}
